# Services for running the application

volumes:
  db-data:
  broker-data:
  prometheus-data:
  grafana-data:
  beatmaps:
  cache-data:
  difficalcy-cache-data:

secrets:
  grafana_admin_password:
    file: ./config/active/secrets/grafana_admin_password

services:
  db:
    image: postgres:17
    volumes:
      - db-data:/var/lib/postgresql/data
    env_file:
      - config/active/postgres.env
    shm_size: 128m

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    env_file:
      - config/active/postgres-exporter.env

  broker:
    image: redis:8
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./config/active/broker-redis.conf:/usr/local/etc/redis/redis.conf
      - broker-data:/data

  broker-exporter:
    image: oliver006/redis_exporter:v1.92.0
    environment:
      REDIS_ADDR: redis://broker:6379
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: tasks,tasks:1,tasks:2,tasks:3,tasks:4,tasks:5,tasks:6,tasks:7,tasks:8,tasks:9
    depends_on:
      - broker

  cache:
    image: redis:8
    volumes:
      - cache-data:/data

  api:
    build: .
    env_file:
      - config/active/django.env
    volumes:
      - beatmaps:/beatmaps
    depends_on:
      - db
      - broker
      - cache
      - difficalcy
      - difficalcy-performanceplus

  worker:
    build: .
    command: celery --app osuchan worker --loglevel info
    healthcheck:
      test: celery --app osuchan inspect ping || exit 1
    env_file:
      - config/active/django.env
    volumes:
      - beatmaps:/beatmaps
    depends_on:
      - db
      - broker
      - difficalcy
      - difficalcy-performanceplus

  worker_monitor:
    build: .
    command: celery --app osuchan flower
    env_file:
      - config/active/django.env
      - config/active/flower.env
    volumes:
      - beatmaps:/beatmaps
    depends_on:
      - worker

  scheduler:
    build: .
    command: celery --app osuchan beat --loglevel info --schedule /tmp/celerybeat-schedule
    env_file:
      - config/active/django.env
    volumes:
      - beatmaps:/beatmaps
    depends_on:
      - broker

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus.rules.yml:/etc/prometheus/rules.yml
      - prometheus-data:/prometheus:rw

  grafana:
    image: grafana/grafana:13.2.2
    env_file:
      - ./config/active/grafana.env
    volumes:
      - grafana-data:/var/lib/grafana:rw
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    secrets:
      - grafana_admin_password

  difficalcy:
    image: ghcr.io/syriiin/difficalcy:v1.0.0-alpha.4-slim
    env_file:
      - config/active/difficalcy.env
    volumes:
      - beatmaps:/beatmaps
    depends_on:
      - difficalcy-cache

  difficalcy-performanceplus:
    image: ghcr.io/syriiin/difficalcy-performanceplus:v1.0.0-alpha.1-slim
    env_file:
      - config/active/difficalcy.env
    volumes:
      - beatmaps:/beatmaps
    depends_on:
      - difficalcy-cache

  difficalcy-cache:
    image: redis:8
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./config/active/difficalcy-redis.conf:/usr/local/etc/redis/redis.conf
      - difficalcy-cache-data:/data
